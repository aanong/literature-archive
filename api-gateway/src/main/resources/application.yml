server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:nacos:api-gateway.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        shared-configs:
          - data-id: literature-common.yaml
            refresh: true
