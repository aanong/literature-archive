server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: nacos
        password: nacos
        namespace: literature-dev
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        username: nacos
        password: nacos
        namespace: literature-dev
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: jwks
          uri: http://localhost:8081
          predicates:
            - Path=/.well-known/jwks.json
        - id: admin-books
          uri: http://localhost:8083
          predicates:
            - Path=/api/admin/books/**
        - id: admin-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/admin/auth/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: content-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/content/**
        - id: knowledge-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/knowledge/**

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
