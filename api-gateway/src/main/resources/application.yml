server:
  port: 18080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:18081/.well-known/jwks.json
  cloud:
    nacos:
      discovery:
        # Nacos console: http://localhost:8848/nacos
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: nacos
        password: nacos
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        username: nacos
        password: nacos
        namespace: ${NACOS_NAMESPACE:}
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: jwks
          uri: lb://user-service
          predicates:
            - Path=/.well-known/jwks.json
        - id: admin-books
          uri: lb://content-service
          predicates:
            - Path=/api/admin/books/**
        - id: admin-auth
          uri: lb://user-service
          predicates:
            - Path=/api/admin/auth/**
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: chat-admin
          uri: lb://chat-service
          predicates:
            - Path=/api/admin/chat/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/content/**
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/api/knowledge/**

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
