server:
  port: 8083

spring:
  application:
    name: knowledge-service
  
  # MySQL配置
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/literature_knowledge?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # MyBatis-Plus 配置
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
  
  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      database: 2
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
    
    # MongoDB配置
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:mongo123@localhost:27017/literature_qa?authSource=admin}
  
  # Nacos配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
#        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: DEFAULT_GROUP


        import-check:
          enabled: false
# LangChain4j配置
langchain4j:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model:
      model-name: ${OLLAMA_MODEL:deepseek-r1:7b}
      temperature: 0.7
      top-p: 0.9
      top-k: 40
      repeat-penalty: 1.1
      num-predict: 2000
      timeout: 60s
    
    embedding-model:
      model-name: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
      timeout: 30s
  
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: knowledge_embeddings
    dimension: 1024  # bge-m3的向量维度
    index-type: IVF_FLAT
    metric-type: COSINE
    nlist: 1024  # IVF索引的聚类中心数

# RAG配置
rag:
  retrieval:
    top-k: 5  # 检索Top-K个相关文档
    min-score: 0.7  # 最小相似度阈值
    max-context-length: 4000  # 最大上下文长度(字符)
  
  prompt:
    system: |
      你是一位精通中国古典文学的AI助手,擅长解读古籍典籍。
      请基于提供的典籍资料回答用户问题,确保答案准确、专业。
      如果引用了典籍内容,请标注出处。
      如果问题超出了提供的资料范围,请如实说明。
    
    template: |
      参考资料:
      {context}
      
      用户问题: {question}
      
      请基于以上参考资料回答问题:
    
    article-generation: |
      请基于以下典籍资料,撰写一篇关于"{topic}"的科普文章。
      
      要求:
      1. 文章结构清晰,包含引言、正文、总结
      2. 引用典籍原文时请标注出处
      3. 语言通俗易懂,适合{target_audience}阅读
      4. 风格: {style}
      5. 字数控制在{length}
      
      参考资料:
      {context}
      
      请开始撰写:

# 缓存配置
cache:
  qa:
    ttl: 3600  # 问答缓存时间(秒)
    max-size: 1000  # 最大缓存数量
  
  knowledge:
    ttl: 7200  # 知识条目缓存时间(秒)
    max-size: 5000

# 日志配置
logging:
  level:
    root: INFO
    com.literature.knowledge: DEBUG
    dev.langchain4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
