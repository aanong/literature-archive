server:
  port: 18090

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/literature_chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  data:
    redis:
      database: 1
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:mongo123}@${MONGO_HOST:localhost}:27017/literature_chat?authSource=admin
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:18081/.well-known/jwks.json} # 指向用户服务的 JWK 端点

# Netty 配置 (对应 NettyServerInitializer / AuthHandler)
netty:
  port: 18091
  ws:
    port: 18092
    path: /ws

# 加密配置 (对应 CryptoProperties)
crypto:
  key: ${CHAT_CRYPTO_KEY:1234567890123456} # AES 128/256 key
  salt: ${CHAT_CRYPTO_SALT:somesalt}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:18081}
